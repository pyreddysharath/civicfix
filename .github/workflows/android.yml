name: Build Android APK
on: [workflow_dispatch, push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r backend/requirements.txt
          npm install --no-save jsdom@26
      - name: Test media screening and application
        run: |
          python -m unittest discover -s backend -p 'test*.py' -v
          node tests/logic-test.cjs
          node tests/ui-test.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build test APK
        run: gradle -p android :app:assembleDebug
      - name: Upload latest test APK
        uses: actions/upload-artifact@v4
        with:
          name: Nenu-Saitham-0.6.6-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Check stable signing configuration
        if: github.event_name != 'pull_request'
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/civicfix.jks"
            chmod 600 "$RUNNER_TEMP/civicfix.jks"
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo '::warning::Only a test APK is available. Configure permanent signing secrets for consistent release updates. See docs/RELEASE-SETUP.md.'
          fi
      - name: Build signed APK
        if: steps.signing.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/civicfix.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android :app:assembleRelease
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          name: Nenu-Saitham-signed-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/civicfix.jks"
